services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./Beacon-Backend/.env
    environment:
      POSTGRES_USER: ${DB_USER:-beacon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      POSTGRES_DB: ${DB_NAME:-beacon}
    ports:
      - '${DB_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Beacon-Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./Beacon-Backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      PORT: 3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      DB_SYNC: ${DB_SYNC:-true}
    ports:
      - '3000:3000'

  frontend:
    build:
      context: ./Beacon-Frontend-Web
      dockerfile: Dockerfile
      args:
        VITE_BACK_URL: ${VITE_BACK_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5173:80'

volumes:
  postgres_data:
